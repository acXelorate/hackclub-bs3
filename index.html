<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>hackclub-bs3</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: sans-serif; }
    canvas { border: 1px solid #444; }
  </style>
</head>
<body>
  <div id="status">Loading Python & Pygame...</div>
  <canvas id="canvas"></canvas>

  <script type="text/javascript">
    async function startPygame() {
      const status = document.getElementById("status");
      const pyodide = await loadPyodide();

      status.textContent = "Loading Pygame-CE...";
      await pyodide.loadPackage("pygame-ce");

      status.textContent = "Loading game files & assets...";

      // 1. All local Python modules in your root directory
      const pyFiles = [
        "campaign.py", "classes.py", "consts.py", "functions.py",
        "images.py", "pgplus.py", "shop.py", "stats.py", "text.py"
      ];

      for (const file of pyFiles) {
        const res = await fetch(file);
        const text = await res.text();
        pyodide.FS.writeFile(file, text);
      }

      // 2. Create ASSETS directory and load every asset file
      pyodide.FS.mkdir("ASSETS");

      // TODO: Add every exact filename from your ASSETS folder here (case-sensitive!)
      const assets = [
        // Example: "tower.png", "enemy.png", "bg.png", "music.ogg"
      ];

      for (const asset of assets) {
        const res = await fetch(`ASSETS/${asset}`);
        if (!res.ok) throw new Error(`Missing asset: ASSETS/${asset}`);
        const buf = await res.arrayBuffer();
        pyodide.FS.writeFile(`ASSETS/${asset}`, new Uint8Array(buf));
      }

      // 3. Bind canvas and launch main.py
      status.style.display = "none";
      const canvas = document.getElementById("canvas");
      pyodide.canvas.setCanvas2D(canvas);

      const mainRes = await fetch("main.py");
      const mainCode = await mainRes.text();
      await pyodide.runPythonAsync(mainCode);
    }

    startPygame().catch(err => {
      document.getElementById("status").textContent = "Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
